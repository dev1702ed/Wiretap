[project]
name = "dcp-backend"
version = "0.1.0.dev0"
description = "DCP ingest, identity resolution, and lineage graph."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "networkx>=3.2", "jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

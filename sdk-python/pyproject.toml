[project]
name = "dcp"
version = "0.1.0.dev0"
description = "Transport-layer data lineage — capture provenance where data physically moves."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["sqlglot>=25.0"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
kafka = ["confluent-kafka>=2.3"]
dev = ["pytest>=8.0", "jsonschema>=4.21", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcp"]

[tool.ruff]
line-length = 100
